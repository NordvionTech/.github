</defs><rect x="10" y="10" width="278" height="235" rx="20" fill="url(#gBlue)"/><rect x="10" y="17" width="278" height="228" rx="20" fill="#FFFFFF" stroke="#E0E7FF" filter="url(#sh)"/><circle cx="149.0" cy="76" r="36" fill="url(#gBlue)"/><text x="149.0" y="88" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle" >A</text><text x="149.0" y="142" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1E1B4B" text-anchor="middle" >Alex Rahman</text><text x="149.0" y="164" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="middle" >Founder &amp; CEO</text><text x="149.0" y="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">“Every project starts with</text><text x="149.0" y="220" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">a real conversation.”</text><rect x="307" y="10" width="278" height="235" rx="20" fill="url(#gViolet)"/><rect x="307" y="17" width="278" height="228" rx="20" fill="#FFFFFF" stroke="#E0E7FF" filter="url(#sh)"/><circle cx="446.0" cy="76" r="36" fill="url(#gViolet)"/><text x="446.0" y="88" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle" >S</text><text x="446.0" y="142" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1E1B4B" text-anchor="middle" >Sara Khan</text><text x="446.0" y="164" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="middle" >Head of AI</text><text x="446.0" y="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">“Smart features only matter if</text><text x="446.0" y="220" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">people actually use them.”</text><rect x="604" y="10" width="278" height="235" rx="20" fill="url(#gPink)"/><rect x="604" y="17" width="278" height="228" rx="20" fill="#FFFFFF" stroke="#E0E7FF" filter="url(#sh)"/><circle cx="743.0" cy="76" r="36" fill="url(#gPink)"/><text x="743.0" y="88" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle" >R</text><text x="743.0" y="142" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1E1B4B" text-anchor="middle" >Rafi Ahmed</text><text x="743.0" y="164" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="middle" >Lead Engineer</text><text x="743.0" y="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">“I like code that is</text><text x="743.0" y="220" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">boring to maintain.”</text><rect x="901" y="10" width="278" height="235" rx="20" fill="url(#gIndigo)"/><rect x="901" y="17" width="278" height="228" rx="20" fill="#FFFFFF" stroke="#E0E7FF" filter="url(#sh)"/><circle cx="1040.0" cy="76" r="36" fill="url(#gIndigo)"/><text x="1040.0" y="88" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle" >N</text><text x="1040.0" y="142" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1E1B4B" text-anchor="middle" >Nadia Islam</text><text x="1040.0" y="164" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="middle" >Design Lead</text><text x="1040.0" y="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">“If it needs a manual,</text><text x="1040.0" y="220" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">we are not done designing.”</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>