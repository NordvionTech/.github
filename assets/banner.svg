<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
      <animate attributeName="x2" values="1;0.6;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity="0.55">
    <circle cx="180" cy="60" r="90" fill="#38BDF8">
      <animate attributeName="cy" values="60;110;60" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="270" r="110" fill="#EC4899">
      <animate attributeName="cy" values="270;220;270" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="40" r="70" fill="#A78BFA">
      <animate attributeName="cx" values="640;720;640" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="90" cy="250" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="40" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="60" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="120" r="2.5"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="285" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="105" font-size="20" font-weight="600" letter-spacing="8" fill="#DDD6FE">&lt;/&gt;  BEYOND INNOVATION  &lt;/&gt;</text>
    <text x="600" y="190" font-size="84" font-weight="800" letter-spacing="4" fill="url(#txt)">NORDVION TECH</text>
    <text x="600" y="240" font-size="26" font-weight="500" fill="#E0E7FF">AI-Powered Software for Startups &amp; Enterprises</text>
    <rect x="450" y="262" width="300" height="5" rx="2.5" fill="#FFFFFF" opacity="0.35"/>
    <rect x="450" y="262" width="90" height="5" rx="2.5" fill="#FFFFFF">
      <animate attributeName="x" values="450;660;450" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
